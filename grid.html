<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Demonstration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
        }

        /* Grid Container */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 150px auto 100px;
            gap: 10px; /* Space between grid items */
            border: 2px solid #ddd;
            padding: 10px;
        }

        /* Grid Items */
        .grid-item {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #4a90e2;
            color: white;
            font-size: 18px;
            border: 1px solid #ccc;
        }

        /* Spanning Items */
        .grid-item-span {
            grid-column: span 2; /* Span across 2 columns */
            grid-row: span 2;    /* Span across 2 rows */
            background-color: #f06;
        }

        /* Explicit Placement */
        .grid-item-placement {
            grid-column: 3 / 4; /* Start at column 3, end at column 4 */
            grid-row: 1 / 3;    /* Start at row 1, end at row 3 */
            background-color: #50c878;
        }
        .city-scene {
            display: grid;
            width: clamp(300px, 80vw, 600px);
            aspect-ratio: 2 / 1;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(5, 1fr);
            position: relative;
            background: linear-gradient(to top, #93c5fd, #bfdbfe);
            overflow: hidden;
            border-radius: 10px;
            }

            /* SKY and SUN */
            .sky {
            grid-column: 1 / -1;
            grid-row: 1 / 4;
            background: linear-gradient(to top, #93c5fd, #bfdbfe);
            z-index: 1;
            }

            .sun {
            grid-column: 8 / 10;
            grid-row: 1 / 2;
            background: radial-gradient(circle, #fde68a, #fbbf24);
            border-radius: 50%;
            z-index: 2;
            animation: sunRise 10s infinite alternate;
            }

            /* CLOUDS */
            .cloud {
            grid-row: 1 / 2;
            background: white;
            border-radius: 20px;
            filter: blur(1px);
            z-index: 3;
            animation: cloudMove 30s linear infinite;
            }

            .cloud1 { grid-column: 2 / 4; animation-delay: 0s; }
            .cloud2 { grid-column: 6 / 8; animation-delay: 15s; }

            /* BUILDINGS */
            .building {
            background: #374151;
            z-index: 4;
            border: 2px solid #1f2937;
            transition: background 1s;
            }

            .b1 { grid-column: 2 / 3; grid-row: 3 / 6; }
            .b2 { grid-column: 5 / 6; grid-row: 2 / 6; }
            .b3 { grid-column: 8 / 9; grid-row: 3 / 6; }

            /* Hover effect: buildings glow */
            .building:hover {
            background: #4b5563;
            box-shadow: 0 0 10px #facc15;
            }

            /* TREE */
            .tree {
            grid-column: 9 / 10;
            grid-row: 4 / 6;
            background: #065f46;
            border-radius: 0 0 10px 10px;
            z-index: 4;
            }

            /* ANIMATIONS */
            @keyframes sunRise {
            0%   { transform: translateY(0); }
            100% { transform: translateY(30%); }
            }

            @keyframes cloudMove {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
            }
    </style>
</head>
<body>
    <h1>CSS Grid Demonstration</h1>
    <p>The grid layout below demonstrates key CSS Grid properties and options.</p>

    <div class="grid-container">
        <div class="grid-item">1</div>
        <div class="grid-item">2</div>
        <div class="grid-item">3</div>
        <div class="grid-item-span">Span 2x2</div>
        <div class="grid-item">5</div>
        <div class="grid-item">6</div>
        <div class="grid-item">7</div>
        <div class="grid-item-placement">Custom Placement</div>
        <div class="grid-item">9</div>
    </div>
    <div class="city-scene">
        <div class="sky"></div>
        <div class="sun"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="building b1"></div>
        <div class="building b2"></div>
        <div class="building b3"></div>
        <div class="tree"></div>
      </div>
      
</body>
</html>
