<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShoeStore – E-Commerce Demo</title>

  <style>
    /* =========================
       GLOBAL RESET & BOX MODEL
    ========================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #222;
    }

    /* =========================
       HEADER (FLEX LAYOUT)
    ========================== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 20px;
      background-color: #111;
      color: white;
    }

    nav a {
      margin-left: 20px;
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    /* =========================
       PAGE LAYOUT (GRID)
       Sidebar + Products
    ========================== */
    .page {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 30px;

      padding: 30px;
    }

    /* =========================
       SIDEBAR (BOX MODEL)
    ========================== */
    aside {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    aside h2 {
      margin-bottom: 15px;
      font-size: 18px;
    }

    .filter-group {
      margin-bottom: 20px;
    }

    .filter-group h3 {
      margin-bottom: 10px;
      font-size: 15px;
    }

    .filter-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    /* =========================
       PRODUCTS GRID
    ========================== */
    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 30px;
    }

    /* =========================
       PRODUCT CARD (BOX + FLEX)
    ========================== */
    .card {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #ddd;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;

      transition: transform 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      border-radius: 8px;
    }

    .price {
      font-weight: bold;
      color: #27ae60;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background-color: #111;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #333;
    }

    /* =========================
       RESPONSIVE (MOBILE)
    ========================== */
    @media (max-width: 768px) {

      header {
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }

      .page {
        grid-template-columns: 1fr;
      }

      aside {
        order: -1;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>ShoeStore</h1>
    <nav>
      <a href="#">Men</a>
      <a href="#">Women</a>
      <a href="#">Cart</a>
    </nav>
  </header>

  <!-- PAGE CONTENT -->
  <div class="page">

    <!-- SIDEBAR FILTERS -->
    <aside>
      <h2>Filters</h2>

      <div class="filter-group">
        <h3>Category</h3>
        <label><input type="checkbox"> Running</label>
        <label><input type="checkbox"> Casual</label>
        <label><input type="checkbox"> Sports</label>
      </div>

      <div class="filter-group">
        <h3>Price</h3>
        <label><input type="checkbox"> Under $100</label>
        <label><input type="checkbox"> $100 – $150</label>
        <label><input type="checkbox"> Above $150</label>
      </div>
    </aside>

    <!-- PRODUCTS -->
    <main>

      <div class="card">
        <img src="https://via.placeholder.com/300" alt="Running Shoes">
        <h3>Running Shoes</h3>
        <p class="price">$120</p>
        <button>Add to Cart</button>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/300" alt="Casual Sneakers">
        <h3>Casual Sneakers</h3>
        <p class="price">$95</p>
        <button>Add to Cart</button>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/300" alt="Sports Shoes">
        <h3>Sports Shoes</h3>
        <p class="price">$150</p>
        <button>Add to Cart</button>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/300" alt="Training Shoes">
        <h3>Training Shoes</h3>
        <p class="price">$110</p>
        <button>Add to Cart</button>
      </div>

    </main>

  </div>

</body>
</html>
